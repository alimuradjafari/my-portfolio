      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)"/>
  <!-- Palette / UI Mockup -->
  <rect x="100" y="60" width="400" height="250" rx="14" fill="#1e293b" stroke="#27D3F5" stroke-width="2"/>
  <circle cx="160" cy="120" r="30" fill="#27D3F5"/>
  <circle cx="240" cy="120" r="30" fill="#0284c7"/>
  <circle cx="320" cy="120" r="30" fill="#38bdf8"/>
