<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27D3F5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <rect x="120" y="60" width="360" height="220" rx="12" fill="#1e293b" stroke="#27D3F5" stroke-width="3"/>
  <rect x="135" y="75" width="330" height="170" rx="6" fill="#090d16"/>
  <!-- Screen content -->
  <rect x="150" y="90" width="120" height="10" rx="3" fill="#27D3F5"/>
  <rect x="150" y="110" width="80" height="8" rx="2" fill="#64748b"/>
  <rect x="150" y="125" width="180" height="8" rx="2" fill="#334155"/>
  <rect x="150" y="140" width="140" height="8" rx="2" fill="#27D3F5" opacity="0.8"/>
  <rect x="290" y="90" width="160" height="130" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="370" cy="155" r="35" fill="none" stroke="#27D3F5" stroke-width="4"/>
  <!-- Monitor stand & Desk -->
  <rect x="270" y="280" width="60" height="40" fill="#334155"/>
  <path d="M230,320 L370,320 L390,330 L210,330 Z" fill="#475569"/>
  <line x1="50" y1="330" x2="550" y2="330" stroke="#27D3F5" stroke-width="4"/>
  <!-- Text -->
  <text x="300" y="370" text-anchor="middle" fill="#27D3F5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" letter-spacing="2">DEVELOPER WORKSPACE</text>
</svg>
